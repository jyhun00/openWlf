<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>필터링 결과 - Watchlist Filtering</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Status Card */
        .status-card {
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
        }
        .status-approved {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }
        .status-rejected {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .status-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .status-message {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Score Section */
        .score-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .score-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .score-value {
            font-size: 32px;
            font-weight: 700;
        }
        .score-low { color: #00b894; }
        .score-medium { color: #f39c12; }
        .score-high { color: #e74c3c; }

        .score-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .score-fill.low { background: linear-gradient(90deg, #00b894, #00cec9); }
        .score-fill.medium { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .score-fill.high { background: linear-gradient(90deg, #e74c3c, #c0392b); }

        /* Alert Reference */
        .alert-ref {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-ref-icon {
            font-size: 20px;
        }
        .alert-ref-text {
            font-size: 13px;
            color: #856404;
        }
        .alert-ref-code {
            font-family: monospace;
            font-weight: 600;
        }

        /* Info Sections */
        .info-section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* Matched Rules */
        .rules-list {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 12px;
            overflow: hidden;
        }
        .rule-item {
            padding: 15px;
            border-bottom: 1px solid #fed7d7;
        }
        .rule-item:last-child {
            border-bottom: none;
        }
        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rule-name {
            font-weight: 600;
            color: #c53030;
        }
        .rule-score {
            background: #c53030;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .rule-type {
            display: inline-block;
            background: #e2e8f0;
            color: #4a5568;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .rule-match {
            font-size: 13px;
            color: #666;
        }
        .rule-match span {
            font-family: monospace;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .no-matches {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #276749;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>필터링 결과</h1>

        <!-- Status Card -->
        <div th:class="${result.registrationAllowed} ? 'status-card status-approved' : 'status-card status-rejected'">
            <div class="status-icon" th:text="${result.registrationAllowed} ? '&#10004;' : '&#10006;'"></div>
            <div class="status-title" th:text="${result.registrationAllowed} ? '회원가입 승인' : '회원가입 거부'"></div>
            <div class="status-message" th:if="${!result.registrationAllowed}" th:text="${result.rejectionReason}"></div>
            <div class="status-message" th:if="${result.registrationAllowed}">회원가입이 가능합니다.</div>
        </div>

        <!-- Score Section -->
        <div class="score-section">
            <div class="score-header">
                <span class="score-label">위험 점수 (Risk Score)</span>
                <span class="score-value"
                      th:classappend="${result.score < 50} ? 'score-low' : (${result.score < 70} ? 'score-medium' : 'score-high')"
                      th:text="${#numbers.formatDecimal(result.score, 1, 1)}"></span>
            </div>
            <div class="score-bar">
                <div class="score-fill"
                     th:classappend="${result.score < 50} ? 'low' : (${result.score < 70} ? 'medium' : 'high')"
                     th:style="'width: ' + ${result.score} + '%'"></div>
            </div>
        </div>

        <!-- Alert Reference -->
        <div class="alert-ref" th:if="${result.alertReference != null}">
            <span class="alert-ref-icon">&#9888;</span>
            <span class="alert-ref-text">
                Alert 생성됨: <span class="alert-ref-code" th:text="${result.alertReference}"></span>
            </span>
        </div>

        <!-- Member Info -->
        <div class="info-section">
            <div class="section-title">신청자 정보</div>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">이름</div>
                    <div class="info-value" th:text="${result.memberInfo.name}"></div>
                </div>
                <div class="info-item" th:if="${result.memberInfo.dateOfBirth != null}">
                    <div class="info-label">생년월일</div>
                    <div class="info-value" th:text="${#temporals.format(result.memberInfo.dateOfBirth, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="info-item" th:if="${result.memberInfo.nationality != null}">
                    <div class="info-label">국적</div>
                    <div class="info-value" th:text="${result.memberInfo.nationality}"></div>
                </div>
                <div class="info-item" th:if="${result.memberInfo.address != null}">
                    <div class="info-label">주소</div>
                    <div class="info-value" th:text="${result.memberInfo.address}"></div>
                </div>
                <div class="info-item" th:if="${result.memberInfo.phoneNumber != null}">
                    <div class="info-label">전화번호</div>
                    <div class="info-value" th:text="${result.memberInfo.phoneNumber}"></div>
                </div>
                <div class="info-item" th:if="${result.memberInfo.email != null}">
                    <div class="info-label">이메일</div>
                    <div class="info-value" th:text="${result.memberInfo.email}"></div>
                </div>
            </div>
        </div>

        <!-- Matched Rules -->
        <div class="info-section">
            <div class="section-title">매칭된 규칙</div>

            <div th:if="${result.matchedRules != null and !result.matchedRules.isEmpty()}" class="rules-list">
                <div class="rule-item" th:each="rule : ${result.matchedRules}">
                    <div class="rule-header">
                        <span class="rule-name" th:text="${rule.ruleName}"></span>
                        <span class="rule-score" th:text="${#numbers.formatDecimal(rule.score, 1, 1)}"></span>
                    </div>
                    <span class="rule-type" th:text="${rule.ruleType}"></span>
                    <div class="rule-match" th:if="${rule.matchedValue != null}">
                        입력값: <span th:text="${rule.matchedValue}"></span>
                        &#8594; 대상: <span th:text="${rule.targetValue}"></span>
                    </div>
                    <div class="rule-match" th:if="${rule.description != null}" th:text="${rule.description}"></div>
                </div>
            </div>

            <div th:if="${result.matchedRules == null or result.matchedRules.isEmpty()}" class="no-matches">
                Watchlist와 일치하는 항목이 없습니다.
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <a th:href="@{/member/register}" class="btn btn-primary">다시 신청하기</a>
            <a href="/" class="btn btn-secondary">홈으로</a>
        </div>
    </div>
</body>
</html>
