<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Watchlist Filtering</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        label .required {
            color: #e74c3c;
            margin-left: 2px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #555;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }
        .user-bar a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar" sec:authorize="isAuthenticated()">
            <span><span sec:authentication="name">user</span></span>
            <a th:href="@{/logout}">로그아웃</a>
        </div>
        <h1>회원가입</h1>
        <p class="subtitle">Watchlist Filtering System</p>

        <div class="info-box">
            입력하신 정보는 AML(자금세탁방지) Watchlist와 대조됩니다.
            필터링 결과에 따라 가입이 제한될 수 있습니다.
        </div>

        <form th:action="@{/member/register}" th:object="${memberRequest}" method="post">

            <div class="form-section">
                <div class="section-title">기본 정보</div>

                <div class="form-group">
                    <label for="name">이름 <span class="required">*</span></label>
                    <input type="text" id="name" th:field="*{name}"
                           placeholder="홍길동" required>
                    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="dateOfBirth">생년월일</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                    </div>

                    <div class="form-group">
                        <label for="nationality">국적</label>
                        <select id="nationality" th:field="*{nationality}">
                            <option value="">선택</option>
                            <option value="KR">대한민국</option>
                            <option value="US">미국</option>
                            <option value="JP">일본</option>
                            <option value="CN">중국</option>
                            <option value="GB">영국</option>
                            <option value="DE">독일</option>
                            <option value="FR">프랑스</option>
                            <option value="RU">러시아</option>
                            <option value="IR">이란</option>
                            <option value="KP">북한</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">주소</label>
                    <input type="text" id="address" th:field="*{address}"
                           placeholder="서울시 강남구 테헤란로 123">
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">연락처 정보</div>

                <div class="form-group">
                    <label for="phoneNumber">전화번호</label>
                    <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                           placeholder="010-1234-5678">
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="hong@example.com">
                </div>
            </div>

            <button type="submit" class="btn-submit">회원가입 신청</button>
        </form>
    </div>
</body>
</html>
