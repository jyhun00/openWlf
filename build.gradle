plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'aml'
    version = '0.0.1-SNAPSHOT'
    
    repositories {
        mavenCentral()
    }
}

// Exclude root src directory from compilation
sourceSets {
    main {
        java {
            srcDirs = []
        }
    }
    test {
        java {
            srcDirs = []
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    
    // UTF-8 인코딩 설정
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }
    
    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
    }
    
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }
    
    dependencies {
        implementation 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        reports {
            html.required = true
            xml.required = true
        }
    }
}

tasks.register('jacocoRootReport', JacocoReport) {
    dependsOn subprojects*.tasks*.named('test')

    additionalSourceDirs.setFrom(subprojects.collect { it.sourceSets.main.allSource })
    sourceDirectories.setFrom(subprojects.collect { it.sourceSets.main.allSource })
    classDirectories.setFrom(subprojects.collect { it.sourceSets.main.output })
    executionData.setFrom(subprojects.collect {
        it.tasks.named('test').map { t -> t.extensions.getByType(JacocoTaskExtension).destinationFile }
    })

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/jacocoRootReport.xml')
    }
}
